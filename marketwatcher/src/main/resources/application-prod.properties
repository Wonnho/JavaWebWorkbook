# Production profile. Set SPRING_PROFILES_ACTIVE=prod in the cloud environment.
# Every ${...} value below must come from the cloud secret/configuration service.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

com.stock.marketwatcher.upload.path=${UPLOAD_PATH}

logging.level.org.springframework=info
logging.level.com.stock.marketwatcher=info
logging.level.org.springframework.security=info

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.name=__Host-MWSESSION
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.tracking-modes=cookie

server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
