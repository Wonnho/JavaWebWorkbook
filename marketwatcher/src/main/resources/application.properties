spring.application.name=marketwatcher
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3309/webdb
spring.datasource.username=webuser
spring.datasource.password=webuser

# Log levels
logging.level.org.springframework=info
logging.level.com.stock.marketwatcher=debug
logging.level.springframework.security=trace

# JPA / MariaDB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Persistent remember-me security key
app.security.remember-me.key=${REMEMBER_ME_KEY:marketwatcher-local-remember-key}

com.stock.marketwatcher.upload.path=C:/Users/user/upload

# Maximum size allowed for a single uploaded file
spring.servlet.multipart.max-file-size=10MB

# Maximum size allowed for multipart/form-data requests
spring.servlet.multipart.max-request-size=10MB



spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me

spring.security.oauth2.client.registration.kakao.client-name=kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect_uri=http://localhost:8080/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.client-id=9aca704bd7a2495a05f48fc2395a6f54


#spring.security.oauth2.client.registration.kakao.client-secret=RmCCF2YZ3IXE9371QeEw2Qwt6k5hBuRH
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
  #spring.security.oauth2.client.registration.kakao.client-authentication-method=POST
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post

# Temporarily disable until consent items are configured
#spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email