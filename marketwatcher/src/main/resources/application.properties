spring.application.name=marketwatcher
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3309/webdb
spring.datasource.username=webuser
spring.datasource.password=webuser

# Log levels
logging.level.org.springframework=info
logging.level.com.stock.marketwatcher=debug
logging.level.springframework.security=trace

# JPA / MariaDB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Persistent remember-me security key
app.security.remember-me.key=${REMEMBER_ME_KEY:marketwatcher-local-remember-key}

com.stock.marketwatcher.upload.path=C:/Users/user/upload

# Maximum size allowed for a single uploaded file
spring.servlet.multipart.max-file-size=10MB

# Maximum size allowed for multipart/form-data requests
spring.servlet.multipart.max-request-size=10MB
