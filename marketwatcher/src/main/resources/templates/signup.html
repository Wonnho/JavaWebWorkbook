<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Stock Market Watcher - Registration</title>
</head>
<body>
<h2>Create Account</h2>

<form th:action="@{/signup}" th:object="${userForm}" method="POST">
    <div>
        <label>Username:</label>
        <input type="text" th:field="*{username}" required />
    </div>
    <div>
        <label>Password:</label>
        <input type="password" th:field="*{password}" required />
    </div>
    <div>
        <label>Email Address:</label>
        <input type="email" th:field="*{email}" required />
    </div>
    <div>
        <label>Mobile Number:</label>
        <input type="text" th:field="*{mobile}" required />
    </div>
    <div>
        <label>Major Key:</label>
        <input type="text" th:field="*{majorKey}" required />
    </div>

    <button type="submit">Sign Up</button>
</form>
</body>
</html>
