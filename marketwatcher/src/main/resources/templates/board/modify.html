<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/basic.html}">

<head>
    <title>Board Modify</title>
</head>

<div layout:fragment="content">
    <div class="row mt-3">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    Board Modify
                </div>
                <div class="card-body">
                    <form th:action="@{/board/modify}" method="post" id="f1">
                        <input th:each="fileName : ${dto.fileNames}"
                               type="hidden" name="fileNames" th:value="${fileName}">
                        <div class="input-group mb-3">
                            <span class="input-group-text">Bno</span>
                            <input type="text" class="form-control" th:value="${dto.bno}" name="bno" readonly>
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text">Title</span>
                            <input type="text" class="form-control" name="title" th:value="${dto.title}">
                        </div>

                        <div class="input-group mb-3">
                            <span class="input-group-text">Content</span>
                            <textarea class="form-control col-sm-5" rows="5" name="content">[[${dto.content}]]</textarea>
                        </div>

                        <div class="input-group mb-3">
                            <span class="input-group-text">Writer</span>
                            <input type="text" class="form-control" th:value="${dto.writer}" name="writer" readonly>
                        </div>

                        <div class="input-group mb-3">
                            <span class="input-group-text">Images</span>
                            <div class="float-end uploadHidden">
                                <button type="button" class="btn btn-primary uploadFileBtn">ADD Files</button>
                            </div>
                        </div>

                        <div class="input-group mb-3">
                            <span class="input-group-text">RegDate</span>
                            <input type="text" class="form-control" th:value="${#temporals.format(dto.regDate, 'yyyy-MM-dd HH:mm:ss')}" readonly>
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text">ModDate</span>
                            <input type="text" class="form-control" th:value="${#temporals.format(dto.modDate, 'yyyy-MM-dd HH:mm:ss')}" readonly>
                        </div>

                        <div class="my-4">
                            <div class="float-end">
                                <button type="button" class="btn btn-primary listBtn">List</button>
                                <button type="button" class="btn btn-secondary modBtn">Modify</button>
                                <button type="button" class="btn btn-danger removeBtn">Remove</button>
                            </div>
                        </div>
                    </form>


                </div><!--end card body-->
            </div><!--end card-->
        </div><!-- end col-->
    </div><!-- end row-->

    <!—- 첨부 파일 섬네일을 보여줄 부분 -->
    <div class="row mt-3">
        <div class="col ">
            <div class="container-fluid d-flex uploadResult" style="flex-wrap: wrap;">
                <th:block th:each="fileName:${dto.fileNames}">
                    <div class="card col-4" th:with = "arr = ${fileName.split('_', 2)}">
                        <div class="card-header d-flex justify-content-center">
                            [[${arr[1]}]]
                            <button type="button" class="btn btn-sm btn-danger"
                                    th:onclick="removeFile([[${arr[0]}]], [[${arr[1]}]], this)">X</button>
                        </div>
                        <div class="card-body">
                            <img th:src="|/view/s_${fileName}|" th:data-src="${fileName}" >
                        </div>
                    </div><!-- card -->
                </th:block>
            </div>
        </div>
    </div>
    <!-- modal that adds uploaded file -->
        <div class="modal uploadModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Upload File</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="input-group mb-3">
                            <input type="file" name="files" class="form-control" multiple >
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary uploadBtn">Upload</button>
                        <button type="button" class="btn btn-outline-dark closeUploadBtn" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div><!-- register modal -->

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/upload.js"></script>

</div>

<script layout:fragment="script" th:inline="javascript">


    const errors = [[${errors}]]
    console.log(errors)

    let errorMsg = ''

    if(errors){
        for (let i = 0; i < errors.length; i++) {
            errorMsg += `${errors[i].field}은(는) ${errors[i].code} \n`
        }
        history.replaceState({}, null, null)
        alert(errorMsg)
    }

<!--processing errors........-->
    const link = [[${pageRequestDTO.getLink()}]]
    const formObj = document.querySelector("#f1")

    document.querySelector(".modBtn").addEventListener("click", async function(e){
        e.preventDefault()
        e.stopPropagation()

        appendFileData()

        try {
            await callRemoveFiles()
            formObj.action = `/board/modify?${link}`
            formObj.method ='post'
            formObj.submit()
        } catch (error) {
            console.error("Removing files failed:", error)
            alert("The selected file could not be removed.")
        }

    }, false)

    function appendFileData() {
        formObj.querySelectorAll('input[name="fileNames"]').forEach(input => input.remove())

        uploadResult.querySelectorAll("img[data-src]").forEach(image => {
            const input = document.createElement("input")
            input.type = "hidden"
            input.name = "fileNames"
            input.value = image.dataset.src
            formObj.appendChild(input)
        })
    }

    function callRemoveFiles() {
        return Promise.all(
            removeFileList.map(({uuid, fileName}) =>
                removeFileToServer(uuid, fileName)
            )
        )
    }


    document.querySelector(".removeBtn").addEventListener("click", function(e){
        e.preventDefault()
        e.stopPropagation()

        //화면에 보이는 파일들을 form tag에 추가
        appendFileData()
        //화면에 안보이도록 처리된 화일들을 form tag에 추가
        appendNotShowData()

        formObj.action = `/board/remove`
        formObj.method ='post'
       // formObj.submit()
    }, false)

    function appendNotShowData() {
    if(removeFileList.length ==0) {
        return
        }

       const target=document.querySelector(".uploadHidden")

       let str=''

       for (let k=0;k<removeFileList.length;k++) {

       const {uuid,fileName}=removeFileList[k];

       str +=`<input type='hidden' name='fileNames' value="${uuid}_${fileName}">`
       }

       target.innerHTML +=str;
     }

    document.querySelector(".listBtn").addEventListener("click", function(e){
        e.preventDefault()
        e.stopPropagation()

        formObj.reset()
        self.location =`/board/list?${link}`

    }, false)


    // list that can be deleted

const removeFileList=[]
function removeFile(uuid,fileName,obj){
    if(!confirm("delete file?")){
    return
    }

    console.log(uuid)
    console.log(fileName)
    console.log(obj)


    removeFileList.push({uuid,fileName})

    const targetDiv=obj.closest(".card")
    targetDiv.remove()
}
     //업로드 모달
    const uploadModal = new bootstrap.Modal(document.querySelector(".uploadModal"))

    document.querySelector(".uploadFileBtn").addEventListener("click", function(e){

        e.stopPropagation()
        e.preventDefault()
        uploadModal.show()

    }, false)

    document.querySelector(".uploadBtn").addEventListener("click", async function(e){
        e.preventDefault()
        e.stopPropagation()

        const fileInput = document.querySelector("input[name='files']")
        const files = fileInput.files

        if (files.length === 0) {
            alert("Please select at least one file.")
            return
        }

        const uploadFormData = new FormData()

        for (let i = 0; i < files.length; i++) {
            uploadFormData.append("files", files[i])
        }

        try {
            const result = await uploadToServer(uploadFormData)
            console.log(result)

            for (const uploadResult of result) {
                showUploadFile(uploadResult)
            }

            fileInput.value = ""
            uploadModal.hide()
        } catch (error) {
            console.error("Upload failed:", error)
            alert(`Upload failed: ${error.response?.status ?? error.message}`)
            uploadModal.hide()
        }

    },false)

    const uploadResult = document.querySelector(".uploadResult")

    function showUploadFile({uuid, fileName, link}){

        const str =`<div class="card col-4">
            <div class="card-header d-flex justify-content-center">
                ${fileName}
                <button type="button" class="btn btn-sm btn-danger" onclick="removeFile('${uuid}', '${fileName}', this)" >X</button>
            </div>
            <div class="card-body">
                 <img src="/view/${link}" data-src="${uuid+"_"+fileName}" >
            </div>
        </div><!-- card -->`

        uploadResult.innerHTML += str


    }



</script>
